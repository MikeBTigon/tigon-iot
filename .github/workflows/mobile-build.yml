# Builds the TIGON IOT phone apps (Capacitor shell around the web app in frontend/).
# - Android: the signed APK (the same app the website offers at /downloads/tigon-iot.apk after a deploy).
# - iOS: a compile check for the simulator (App Store builds need an Apple Developer account).
#
# Optional repository secrets:
#   GOOGLE_SERVICES_JSON          contents of google-services.json (Android push alerts)
#   GOOGLE_SERVICE_INFO_PLIST     contents of GoogleService-Info.plist (iOS push alerts)
name: Build phone apps

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Build signed APK
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret not set - the app builds, but push alerts won't work."
          fi
          ../scripts/build-android.sh android/app/build/outputs/tigon/tigon-iot.apk

      - uses: actions/upload-artifact@v6
        with:
          name: tigon-iot-android-apk
          path: |
            frontend/android/app/build/outputs/tigon/tigon-iot.apk
            frontend/android/app/build/outputs/tigon/version.json

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Sync native project
        run: npx cap sync ios

      - name: Add Firebase config (push alerts)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
          fi

      - name: Compile for iOS Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
