# Builds the TIGON IOT phone apps (Capacitor shell around the web app in frontend/).
# - Android: a debug APK you can install directly (download it from the run's "Artifacts").
# - iOS: a compile check for the simulator (App Store builds need an Apple Developer account).
#
# Optional repository secrets:
#   GOOGLE_SERVICES_JSON          contents of google-services.json (Android push alerts)
#   GOOGLE_SERVICE_INFO_PLIST     contents of GoogleService-Info.plist (iOS push alerts)
name: Build phone apps

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Sync native project
        run: npx cap sync android

      - name: Add Firebase config (push alerts)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set - the app builds, but push alerts won't work."
          fi

      - name: Build APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tigon-iot-android-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Sync native project
        run: npx cap sync ios

      - name: Add Firebase config (push alerts)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
          fi

      - name: Compile for iOS Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          exit ${PIPESTATUS[0]}
