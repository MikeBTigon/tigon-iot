# Deploys TIGON IOT (web dashboard + MP Assistant, Cloud Functions, Firestore rules)
# to Firebase project "tigon-iot" on every push to main. Can also be run by hand
# from the Actions tab ("Run workflow").
#
# One-time setup: add a repository secret FIREBASE_SERVICE_ACCOUNT containing the
# JSON key of a service account with deploy permissions (see mp-assistant/README.md).
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build web dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Stage hosting files
        run: |
          rm -rf dist
          cp -r frontend/dist dist

      # The Android phone app is built with every deploy and published on the website:
      # https://tigoniot.com/downloads/tigon-iot.apk (+ version.json, used by the app's update check).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build Android app for the Download page
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: scripts/build-android.sh "$GITHUB_WORKSPACE/dist/downloads/tigon-iot.apk"

      - name: Build Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Only the MP Assistant functions are deployed from this repo. The live IoT functions
      # (onUserCreate, validateEmailDomain, ...) were deployed from other code that isn't in
      # GitHub yet, so they must not be overwritten or deleted by this workflow.
      # The AI listing writer is included only when the repository variable ENABLE_AI_WRITER
      # is "true" (it needs the ANTHROPIC_API_KEY secret in Google Secret Manager first).
      # Webhook Flows: submissions are processed by whProcess every minute. Set the repository
      # variable WH_REALTIME to "true" to also process them instantly with a Firestore trigger.
      - name: Deploy
        env:
          ENABLE_AI_WRITER: ${{ vars.ENABLE_AI_WRITER }}
          WH_REALTIME: ${{ vars.WH_REALTIME }}
        run: |
          FUNCS="mpSyncInventory mpSyncNow mpCreatePairingCode mpPairDevice mpSendQueueItem mpDispatchQueue mpMonitor mpApprovalDigest mpBackup mpBackupNow mpRunImport mpImportScheduled mpCrmReminders mpWeeklyDigest mpLink mpStorefrontApi mpEchoRegister mpEcho"
          FUNCS="$FUNCS whIngest whProcess whReplay whTestEmail whTestWebhook whDeleteSubmissions whAlerts whMaintenance"
          if [ "$ENABLE_AI_WRITER" = "true" ]; then
            FUNCS="$FUNCS mpAiListing mpAiSnap"
            echo "ENABLE_AI_WRITER=true" >> functions/.env
          fi
          if [ "$WH_REALTIME" = "true" ]; then
            FUNCS="$FUNCS whOnSubmission"
            echo "WH_REALTIME=true" >> functions/.env
          fi
          ONLY="firestore:rules,storage,hosting"
          for f in $FUNCS; do ONLY="$ONLY,functions:$f"; done
          echo "Deploying: $ONLY"
          npx --yes firebase-tools@latest deploy --only "$ONLY" --project tigon-iot --non-interactive --force
