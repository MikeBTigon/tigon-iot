apply plugin: 'com.android.application'

// App version: CI passes APP_VERSION_CODE / APP_VERSION_NAME (build number); local builds use the defaults.
def appVersionCode = (System.getenv("APP_VERSION_CODE") ?: "2000").toInteger()
def appVersionName = System.getenv("APP_VERSION_NAME") ?: "2.0.0"

// Release signing key: NEVER stored in git. CI decodes the ANDROID_KEYSTORE_BASE64 secret into a temp file and
// passes it in with these environment variables (see docs/RUNBOOK.md "Android signing key").
//   TIGON_KEYSTORE_PATH   path to the .keystore file
//   TIGON_STORE_PASSWORD  keystore password
//   TIGON_KEY_ALIAS       key alias (default "tigon")
//   TIGON_KEY_PASSWORD    key password (default = store password)
// Without them, `assembleRelease` fails on purpose: a public APK must never be unsigned or debug-signed.
// Debug builds (`assembleDebug`, Android Studio "Run") use the normal Android debug key.
def releaseStorePath = System.getenv("TIGON_KEYSTORE_PATH") ?: ""
def releaseStorePw = System.getenv("TIGON_STORE_PASSWORD") ?: ""
def releaseKeyAlias = System.getenv("TIGON_KEY_ALIAS") ?: "tigon"
def releaseKeyPw = System.getenv("TIGON_KEY_PASSWORD") ?: releaseStorePw
def hasReleaseKey = releaseStorePath && releaseStorePw && file(releaseStorePath).exists()

android {
    namespace = "com.tigongolfcarts.iot"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tigongolfcarts.iot"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKey) {
            tigon {
                storeFile file(releaseStorePath)
                storePassword releaseStorePw
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPw
            }
        }
    }
    buildTypes {
        // debug: default Android debug key (for testing only; it cannot update the published app and is never published).
        release {
            if (hasReleaseKey) signingConfig signingConfigs.tigon
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Refuse to produce a release APK without the real signing key (it could not update the installed app).
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.project == project && it.name.toLowerCase().contains("release") && (it.name.startsWith("assemble") || it.name.startsWith("bundle") || it.name.startsWith("package")) }
    if (wantsRelease && !hasReleaseKey) {
        throw new GradleException("Release signing key missing. Set TIGON_KEYSTORE_PATH and TIGON_STORE_PASSWORD " +
            "(CI: add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets). See docs/RUNBOOK.md.")
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
